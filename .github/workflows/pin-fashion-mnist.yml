name: Fetch and pin official Fashion-MNIST

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pin-fashion-mnist.yml
      - scripts/download_official_data.py
      - scripts/prepare_data.py
      - scripts/verify_splits.py
      - src/**
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pin-fashion-mnist
  cancel-in-progress: false

jobs:
  download-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download all four official IDX archives and verify MD5/SHA256
        run: python scripts/download_official_data.py
      - name: Freeze real-data splits before any fitting
        run: python scripts/prepare_data.py
      - name: Verify immutable split metadata and disjointness
        run: python scripts/verify_splits.py
      - name: Run offline unit tests
        run: python -m pytest -q
      - name: Record CPU hardware, feature extraction, training and validation inference
        run: python scripts/smoke_run.py
      - name: Commit verified canonical data and reproducible results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/raw/train-images-idx3-ubyte.gz data/raw/train-labels-idx1-ubyte.gz
          git add -f data/raw/t10k-images-idx3-ubyte.gz data/raw/t10k-labels-idx1-ubyte.gz
          git add -f data/source_manifest.json
          git add splits/indices.npz splits/manifest.json results/cpu-smoke.json
          if git diff --cached --quiet; then
            echo 'Verified data already committed; no changes.'
          else
            git commit -m 'Pin official Fashion-MNIST archives, stratified splits and CPU smoke results'
            git push origin HEAD:main
          fi
